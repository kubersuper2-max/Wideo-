<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Mózg w hipnozie</title>
<style>html,body{margin:0;padding:0;background:#050816;overflow:hidden}canvas{display:block}</style>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ============================================================
//  Mózg w hipnozie - animacja (poziom: #h 1920x1080, pion: #v 1080x1920)
//  render(t) rysuje klatkę dla czasu t [s]; czasy scen i napisów z timeline.js
// ============================================================
const VERT = location.hash.includes('v');
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const FONT = "'Inter','DejaVu Sans',sans-serif";
const TL = window.TIMELINE;
const DURATION = TL.duration;

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeBack = k => { k = clamp(k); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const frac = x => x - Math.floor(x);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${clamp(a)})`; }
function mix(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  return '#' + [16, 8, 0].map(s => Math.round(lerp(a >> s & 255, b >> s & 255, clamp(k))).toString(16).padStart(2, '0')).join('');
}
const C = { text: '#f3f5ff', muted: '#a9b3e0', faint: '#6873a3', cyan: '#4fd9ff', orange: '#ff8a3d', green: '#5cf0a0', violet: '#b48cff', pink: '#ff5fa8', yellow: '#ffd75e', red: '#ff4d5e', teal: '#45e3d0' };

// ---------- timeline ----------
const SC = {}; TL.scenes.forEach((s, i) => { s.i = i; SC[s.id] = s; });
function sceneIndex(t) { let i = 0; TL.scenes.forEach((s, k) => { if (t >= s.start) i = k; }); return i; }
function sw(id, t, fade = 0.55) { const s = SC[id]; return clamp(Math.min((t - s.start + fade / 2) / fade, (s.end + fade / 2 - t) / fade)); }
const lt = (id, t) => t - SC[id].start;
const lp = (id, t) => (t - SC[id].start) / (SC[id].end - SC[id].start);

// ---------- układ ----------
const LY = VERT ? {
  vp: { cx: 540, cy: 1060, w: 1080 },
  head: { x: 540, y: 190, w: 960, size: 80, align: 'center' },
  sub: { x: 540, y: 1600, w: 960, size: 56 },
  meter: { x: 170, y: 470, w: 740 }
} : {
  vp: { cx: 600, cy: 500, w: 1180 },
  head: { x: 1220, y: 300, w: 640, size: 66, align: 'left' },
  sub: { x: 960, y: 975, w: 1500, size: 46 },
  meter: { x: 1220, y: 560, w: 600 }
};
const BASE = LY.vp.w / 1150;

// ---------- geometria świata (mózg ~1000x700 wokół 0,0; głowa skierowana w lewo) ----------
const OUT = new Path2D(`M -430 80 C -500 20 -500 -150 -420 -240 C -330 -340 -170 -370 -20 -365 C 150 -360 330 -310 420 -200
 C 490 -110 500 20 450 110 C 420 160 360 150 300 140 C 230 150 170 190 90 195 C -20 205 -150 210 -230 170
 C -290 140 -300 90 -280 70 C -330 95 -390 105 -430 80 Z`);
const HEAD = new Path2D(`M -60 -560 C 260 -580 600 -440 640 -100 C 670 150 600 340 460 480 C 380 570 350 690 350 830
 C 520 910 820 960 940 1110 C 1020 1260 1020 1600 1020 2500 L -1020 2500 C -1020 1600 -1010 1260 -940 1110
 C -820 960 -540 910 -340 840 C -310 750 -300 670 -330 610 C -430 590 -560 580 -600 540 C -640 505 -630 465 -660 435
 C -680 415 -660 395 -675 372 C -690 352 -670 332 -685 302 C -720 282 -790 262 -772 222 C -745 168 -690 90 -670 30
 C -660 -10 -690 -60 -680 -120 C -670 -300 -420 -550 -60 -560 Z`);
const test = document.createElement('canvas').getContext('2d');
const inBrain = (x, y) => test.isPointInPath(OUT, x, y);

const R = {
  dlpfc: { x: -300, y: -195, rx: 95, ry: 70, col: C.cyan },
  dacc: { x: -150, y: -95, rx: 90, ry: 48, col: C.orange },
  mpfc: { x: -395, y: -30, rx: 60, ry: 60, col: C.violet },
  pcc: { x: 150, y: -150, rx: 75, ry: 50, col: C.violet },
  insula: { x: -100, y: 55, rx: 85, ry: 42, col: C.green },
  s1: { x: 40, y: -270, rx: 55, ry: 70, col: C.yellow }
};

const PTS = [];
(function () {
  const r = mulberry32(42);
  while (PTS.length < 520) {
    const x = -470 + r() * 940, y = -360 + r() * 560;
    if (!inBrain(x, y)) continue;
    const a = r() * Math.PI * 2, d = 900 + r() * 1400;
    PTS.push({ x, y, sx: Math.cos(a) * d, sy: Math.sin(a) * d * 0.8 + 200, f: 1.2 + r() * 3.5, ph: r() * 100, s: 1.2 + r() * 2.4, delay: r() });
  }
})();
const NODES = [], EDGES = [];
(function () {
  const r = mulberry32(9); let tries = 0;
  while (NODES.length < 64 && tries++ < 20000) {
    const x = -450 + r() * 900, y = -340 + r() * 520;
    if (!inBrain(x, y) || NODES.some(n => Math.hypot(n.x - x, n.y - y) < 70)) continue;
    NODES.push({ x, y });
  }
  NODES.forEach((n, i) => {
    NODES.map((m, j) => [j, Math.hypot(m.x - n.x, m.y - n.y)]).filter(a => a[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, 3)
      .forEach(([j]) => { if (!EDGES.some(e => e.a === j && e.b === i)) EDGES.push({ a: i, b: j, ph: r(), rate: 0.25 + r() * 0.5, dir: r() < 0.5 }); });
  });
})();
const SULCI = [];
(function () {
  const r = mulberry32(7); let tries = 0;
  while (SULCI.length < 60 && tries++ < 5000) {
    let x = -470 + r() * 940, y = -360 + r() * 560;
    if (!inBrain(x, y)) continue;
    let ang = r() * Math.PI * 2; const pts = [[x, y]];
    for (let i = 0, n = 4 + Math.floor(r() * 6); i < n; i++) { ang += (r() - 0.5) * 1.6; x += Math.cos(ang) * (24 + r() * 16); y += Math.sin(ang) * (24 + r() * 16); pts.push([x, y]); }
    SULCI.push(pts);
  }
})();
const STARS = []; (function () { const r = mulberry32(3); for (let i = 0; i < 220; i++) STARS.push({ x: r() * W, y: r() * H, z: 0.2 + r() * 0.8, ph: r() * 10 }); })();
const DISTR = []; (function () { const r = mulberry32(21); for (let i = 0; i < 26; i++) { const a = r() * Math.PI * 2, d = 600 + r() * 380; DISTR.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.8 - 60, s: 10 + r() * 22, ph: r() * 6, col: [C.pink, C.yellow, C.cyan, C.violet][i % 4], shape: i % 3 }); } })();

// ---------- kamera ----------
function camTarget(id, t) {
  const p = clamp(lp(id, t));
  switch (id) {
    case 'intro': { const k = ease((t - 0.3) / (SC.intro.end - 0.6)); return { x: lerp(-40, 0, k), y: lerp(VERT ? 520 : 560, -40, k), z: lerp(VERT ? 0.34 : 0.3, 0.98, k) }; }
    case 'sen': return { x: 0, y: -40, z: 0.98 + 0.06 * p };
    case 'kontakt': return VERT ? { x: -420, y: 0, z: 0.6 + 0.04 * p } : { x: -380, y: 30, z: 0.52 + 0.03 * p };
    case 'fale': return { x: 0, y: -60, z: 0.92 + 0.05 * p };
    case 'podswiadomosc': return VERT ? { x: 3400, y: 450, z: 0.52 + 0.03 * p } : { x: 3400, y: 380, z: 0.5 + 0.03 * p };
    case 'alarm': return VERT ? { x: -130, y: -95, z: 1.55 + 0.1 * p } : { x: -40, y: -80, z: 1.12 + 0.08 * p };
    case 'cialo': return VERT ? { x: 60, y: 760, z: 0.4 + 0.03 * p } : { x: 60, y: 640, z: 0.37 + 0.02 * p };
    case 'krytyk': return VERT ? { x: 0, y: -260, z: 0.84 + 0.05 * p } : { x: 0, y: -300, z: 0.8 + 0.04 * p };
    case 'bol': return VERT ? { x: 120, y: 560, z: 0.43 + 0.03 * p } : { x: 120, y: 640, z: 0.4 + 0.02 * p };
    case 'koniec': return VERT ? { x: 0, y: 260, z: 0.5 - 0.03 * p } : { x: 0, y: 300, z: 0.5 - 0.03 * p };
  }
}
function camera(t) {
  const i = sceneIndex(t), s = TL.scenes[i];
  const cur = camTarget(s.id, t);
  if (i === 0) return cur;
  const from = camTarget(TL.scenes[i - 1].id, s.start);
  const far = Math.hypot(cur.x - from.x, cur.y - from.y) > 1500;
  const k = ease((t - s.start) / (far ? 1.9 : 1.3));
  return { x: lerp(from.x, cur.x, k), y: lerp(from.y, cur.y, k), z: Math.exp(lerp(Math.log(from.z), Math.log(cur.z), k)) };
}
function W2S(cam, x, y) { const s = BASE * cam.z; return [LY.vp.cx + (x - cam.x) * s, LY.vp.cy + (y - cam.y) * s]; }

// ---------- tło ----------
function drawBackground(t) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 50, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  g.addColorStop(0, '#111c52'); g.addColorStop(0.55, '#080d2a'); g.addColorStop(1, '#02040c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const x = (s.x + t * 8 * s.z) % W, y = s.y + Math.sin(t * 0.3 + s.ph) * 6;
    ctx.fillStyle = `rgba(170,190,255,${0.12 + 0.35 * s.z * (0.6 + 0.4 * Math.sin(t * 1.3 + s.ph))})`;
    ctx.fillRect(x, y, 1.6 * s.z + 0.4, 1.6 * s.z + 0.4);
  }
}
function drawSpiral(t, cx, cy, alpha, sc) {
  if (alpha <= 0.002) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.7); ctx.lineWidth = 3;
  for (let arm = 0; arm < 2; arm++) {
    ctx.beginPath();
    for (let i = 0; i < 900; i++) { const th = i * 0.045, r = th * 30 * sc; const x = Math.cos(th + arm * Math.PI) * r, y = Math.sin(th + arm * Math.PI) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = rgba(arm ? C.violet : C.cyan, 0.2 * alpha); ctx.stroke();
  }
  ctx.restore();
}

// ---------- ciało ----------
let breathPhase = 0, heartPhase = 0;
function vitals(t) {
  const calm = ramp(t, SC.cialo.start + 1.5, SC.cialo.end);
  return { br: lerp(0.32, 0.17, calm), hr: lerp(1.45, 0.95, calm), calm };
}
function integrate(t) { let b = 0, h = 0; const dt = 1 / 30; for (let x = 0; x < t; x += dt) { const v = vitals(x); b += v.br * dt; h += v.hr * dt; } breathPhase = b; heartPhase = h; }
function heartPath(cx, cy, s) {
  ctx.beginPath(); ctx.moveTo(cx, cy + s * 0.9);
  ctx.bezierCurveTo(cx - s * 1.6, cy - s * 0.1, cx - s * 0.9, cy - s * 1.3, cx, cy - s * 0.45);
  ctx.bezierCurveTo(cx + s * 0.9, cy - s * 1.3, cx + s * 1.6, cy - s * 0.1, cx, cy + s * 0.9); ctx.closePath();
}
const ARM = [[900, 1750], [890, 1450], [860, 1150], [500, 1000], [260, 900], [210, 600], [190, 400]];
function polyPoint(pts, k) {
  const seg = []; let L = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let target = clamp(k) * L;
  for (let i = 0; i < seg.length; i++) { if (target <= seg[i]) { const q = target / seg[i]; return [lerp(pts[i][0], pts[i + 1][0], q), lerp(pts[i][1], pts[i + 1][1], q)]; } target -= seg[i]; }
  return pts[pts.length - 1];
}
function drawBody(t, reveal, focus) {
  ctx.save();
  const g = ctx.createLinearGradient(0, -600, 0, 2400);
  g.addColorStop(0, rgba('#3a56c8', 0.12)); g.addColorStop(1, rgba('#1a2560', 0.04));
  ctx.globalAlpha = reveal; ctx.fillStyle = g; ctx.fill(HEAD);
  ctx.setLineDash([10000 * reveal, 10000]);
  ctx.strokeStyle = rgba(C.cyan, 0.5); ctx.lineWidth = 4; ctx.stroke(HEAD);
  ctx.setLineDash([]);
  ctx.strokeStyle = rgba(C.cyan, 0.2); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(880, 1180); ctx.bezierCurveTo(840, 1500, 830, 1900, 840, 2500); ctx.stroke();
  ctx.restore();
  if (focus <= 0.01) return;
  const v = vitals(t);
  ctx.save(); ctx.globalAlpha = focus;
  ctx.strokeStyle = rgba(C.cyan, 0.4); ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(200, 400); ctx.bezierCurveTo(230, 820, 430, 1250, 470, 2500); ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = rgba(C.green, 0.25 + 0.45 * v.calm);
  [[330, 1150, 120, 1400], [380, 1300, -150, 1640], [300, 1050, 800, 1250]].forEach(([a, b, c, d]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.quadraticCurveTo((a + c) / 2, b - 80, c, d); ctx.stroke(); });
  const breath = 0.5 - 0.5 * Math.cos(2 * Math.PI * breathPhase);
  const ls = 1 + 0.08 * breath;
  const lg = ctx.createRadialGradient(80, 1560, 20, 80, 1560, 380 * ls);
  lg.addColorStop(0, rgba(C.teal, 0.25 + 0.35 * breath)); lg.addColorStop(1, rgba(C.teal, 0.03));
  ctx.fillStyle = lg; ctx.strokeStyle = rgba(C.teal, 0.65); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(80, 1560, 280 * ls, 380 * ls, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const hb = Math.pow(Math.max(0, Math.sin(2 * Math.PI * heartPhase)), 6);
  ctx.globalCompositeOperation = 'lighter';
  heartPath(-230, 1700, 90 * (1 + 0.16 * hb));
  ctx.fillStyle = rgba(mix(C.red, C.pink, v.calm), 0.55 + 0.4 * hb); ctx.shadowColor = C.red; ctx.shadowBlur = 30 * hb; ctx.fill();
  ctx.restore();
}

// ---------- mózg ----------
function regionGlow(reg, inten, ring, t, col = reg.col, dashed = true) {
  const a = clamp(inten * (0.92 + 0.08 * Math.sin(t * 2.2 + reg.x * 0.01)));
  if (a > 0.005) {
    const g = ctx.createRadialGradient(reg.x, reg.y, 0, reg.x, reg.y, Math.max(reg.rx, reg.ry) * 1.7);
    g.addColorStop(0, rgba(col, 0.9 * a)); g.addColorStop(0.45, rgba(col, 0.35 * a)); g.addColorStop(1, rgba(col, 0));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(reg.x, reg.y, reg.rx * 1.7, reg.ry * 1.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  if (ring > 0.01) {
    ctx.save(); ctx.lineWidth = 4; ctx.strokeStyle = rgba(col, 0.9 * ring);
    if (dashed) { ctx.setLineDash([12, 9]); ctx.lineDashOffset = -t * 24; }
    ctx.beginPath(); ctx.ellipse(reg.x, reg.y, reg.rx, reg.ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
}
function link(a, b, strength, vis, t, col, bend) {
  if (vis <= 0.01) return;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + bend;
  const Q = k => [(1 - k) * (1 - k) * a.x + 2 * (1 - k) * k * mx + k * k * b.x, (1 - k) * (1 - k) * a.y + 2 * (1 - k) * k * my + k * k * b.y];
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(col, (0.1 + 0.55 * strength) * vis); ctx.lineWidth = 2 + 12 * strength;
  if (strength < 0.4) { ctx.setLineDash([4 + 20 * strength, 18]); ctx.lineDashOffset = -t * 30; }
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
  const n = Math.round(1 + strength * 6);
  for (let i = 0; i < n; i++) {
    const [x, y] = Q(frac(t * (0.2 + 0.4 * strength) + i / n));
    const rr = 8 + 16 * strength;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    g.addColorStop(0, rgba('#ffffff', vis * (0.25 + 0.75 * strength))); g.addColorStop(0.35, rgba(col, vis * 0.8 * (0.25 + 0.75 * strength))); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
const brainActivity = t => lerp(1, 0.45, ramp(t, SC.sen.start + 2, SC.alarm.end));

function drawBrain(t, form, fillA) {
  const act = brainActivity(t);
  ctx.save(); ctx.globalAlpha = fillA;
  ctx.fillStyle = '#121a44'; ctx.strokeStyle = rgba(C.cyan, 0.4); ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(140, 170); ctx.bezierCurveTo(170, 260, 175, 330, 160, 420); ctx.lineTo(228, 420); ctx.bezierCurveTo(238, 320, 232, 240, 232, 160); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(320, 200, 150, 82, -0.1, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(320, 190, 10, 320, 200, 160); cg.addColorStop(0, '#22307a'); cg.addColorStop(1, '#0e1640');
  ctx.fillStyle = cg; ctx.fill(); ctx.stroke();
  ctx.save(); ctx.clip(); ctx.strokeStyle = rgba(C.cyan, 0.18); ctx.lineWidth = 2;
  for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(160, 200 + i * 13); ctx.quadraticCurveTo(320, 185 + i * 15, 480, 200 + i * 13); ctx.stroke(); }
  ctx.restore();
  const g = ctx.createRadialGradient(-100, -160, 30, 0, -40, 560);
  g.addColorStop(0, '#2c3d8c'); g.addColorStop(0.6, '#16225c'); g.addColorStop(1, '#0b1238');
  ctx.fillStyle = g; ctx.fill(OUT);
  ctx.save(); ctx.clip(OUT);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pts of SULCI) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    ctx.strokeStyle = 'rgba(5,8,30,0.32)'; ctx.lineWidth = 6; ctx.stroke();
    ctx.strokeStyle = rgba(C.cyan, 0.09); ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(3,5,22,0.8)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(-285, 70); ctx.bezierCurveTo(-150, 20, 50, 10, 200, -60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, -365); ctx.bezierCurveTo(-40, -250, 10, -170, -60, 5); ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(C.cyan, 0.1); ctx.lineWidth = 1.5;
  ctx.beginPath(); for (const e of EDGES) { const a = NODES[e.a], b = NODES[e.b]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); } ctx.stroke();
  for (const e of EDGES) {
    const win = 0.45 * act + 0.08;
    const ph = frac(t * e.rate * (0.5 + act) + e.ph);
    if (ph > win) continue;
    const k = ph / win;
    const a = NODES[e.dir ? e.a : e.b], b = NODES[e.dir ? e.b : e.a];
    ctx.fillStyle = `rgba(150,225,255,${Math.sin(k * Math.PI) * (0.4 + 0.6 * act)})`;
    ctx.beginPath(); ctx.arc(lerp(a.x, b.x, k), lerp(a.y, b.y, k), 4.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = rgba(C.cyan, 0.28);
  for (const n of NODES) { ctx.beginPath(); ctx.arc(n.x, n.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.shadowColor = rgba(C.cyan, 0.9); ctx.shadowBlur = 28; ctx.strokeStyle = rgba(C.cyan, 0.8); ctx.lineWidth = 3.5; ctx.stroke(OUT); ctx.restore();
  ctx.restore();

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of PTS) {
    const k = easeOut((form - p.delay * 0.35) / 0.65);
    const x = lerp(p.sx, p.x, k), y = lerp(p.sy, p.y, k);
    const flying = 1 - k;
    const spark = Math.pow(Math.max(0, Math.sin(t * p.f + p.ph)), 8) * act;
    const al = flying > 0.01 ? 0.35 + 0.6 * (1 - flying) : spark * 0.85;
    if (al < 0.03) continue;
    ctx.fillStyle = `rgba(150,222,255,${al})`;
    ctx.beginPath(); ctx.arc(x, y, p.s * (flying > 0.01 ? 1.8 : 1 + spark), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---------- efekty scen ----------
function worldEffects(t) {
  // ALARM
  const wA = sw('alarm', t);

    const lh = size * 1.12;
    let wi = 0;
    lines.forEach((ln, li) => {
      const lw = ctx.measureText(ln.join(' ')).width;
      let x = LY.head.align === 'center' ? LY.head.x - lw / 2 : LY.head.x;
      const y = LY.head.y + li * lh;
      ln.forEach(word => {
        const k = clamp((L - 0.1 - wi * 0.09) / 0.45);
        ctx.globalAlpha = w * easeOut(k);
        const dy = (1 - easeBack(k)) * 40;
        if (big) { const g = ctx.createLinearGradient(x, 0, x + 600, 0); g.addColorStop(0, '#9fe8ff'); g.addColorStop(1, '#e2d4ff'); ctx.fillStyle = g; ctx.shadowColor = rgba(C.cyan, 0.7); ctx.shadowBlur = 30; }
        else { ctx.fillStyle = C.text; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 18; }
        ctx.textBaseline = 'top'; ctx.textAlign = 'left';
        ctx.fillText(word, x, y + dy);
        x += ctx.measureText(word + ' ').width; wi++;
      });
    });
    if (s.label) {
      const k = clamp((L - 0.9) / 0.5);
      ctx.globalAlpha = w * easeOut(k); ctx.shadowBlur = 0;
      ctx.font = `600 ${Math.round(size * 0.42)}px ${FONT}`;
      const tw = ctx.measureText(s.label).width + 66, th = size * 0.72;
      const y = LY.head.y + lines.length * lh + 18 + (1 - easeOut(k)) * 20;
      const x = LY.head.align === 'center' ? LY.head.x - tw / 2 : LY.head.x;
      const col = { alarm: C.orange, cialo: C.green, krytyk: C.violet, fale: C.cyan, podswiadomosc: C.pink }[s.id] || C.cyan;
      ctx.fillStyle = rgba(col, 0.15); ctx.strokeStyle = rgba(col, 0.75); ctx.lineWidth = 2;
      roundRect(x, y, tw, th, th / 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 28, y + th / 2, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.fillText(s.label, x + 46, y + th / 2 + 1);
    }
    ctx.restore();
  });
}
function subtitles(t) {
  const ch = TL.chunks.find(c => t >= c.start - 0.12 && t <= c.end + 0.3);
  if (!ch) return;
  const a = clamp(Math.min((t - ch.start + 0.12) / 0.12, (ch.end + 0.3 - t) / 0.15));
  const words = ch.text.split(' ');
  const wts = words.map(w => w.length + 2), tot = wts.reduce((p, q) => p + q, 0);
  let acc = 0; const times = wts.map(w => { const s = ch.start + (ch.end - ch.start) * acc / tot; acc += w; return s; });
  const size = LY.sub.size;
  ctx.save();
  ctx.font = `700 ${size}px ${FONT}`;
  const lines = wrapWords(words, LY.sub.w);
  const lh = size * 1.25, totalH = lines.length * lh, y0 = LY.sub.y - totalH / 2;
  const maxLW = Math.max(...lines.map(l => ctx.measureText(l.join(' ')).width));
  ctx.globalAlpha = a * 0.6; ctx.fillStyle = '#050816';
  roundRect(LY.sub.x - maxLW / 2 - 34, y0 - 16, maxLW + 68, totalH + 28, 26); ctx.fill();
  let wi = 0;
  lines.forEach((ln, li) => {
    let x = LY.sub.x - ctx.measureText(ln.join(' ')).width / 2;
    ln.forEach(word => {
      const ws = times[wi], we = wi + 1 < times.length ? times[wi + 1] : ch.end;
      const active = t >= ws && t < we, past = t >= we;
      const pop = active ? 1 + 0.07 * Math.sin(clamp((t - ws) / 0.18) * Math.PI) : 1;
      const ww = ctx.measureText(word).width;
      ctx.save();
      ctx.translate(x + ww / 2, y0 + li * lh + size / 2); ctx.scale(pop, pop);
      ctx.globalAlpha = a * (active || past ? 1 : 0.5);
      ctx.fillStyle = active ? C.yellow : C.text;
      ctx.shadowColor = active ? rgba(C.yellow, 0.6) : 'rgba(0,0,0,0.8)'; ctx.shadowBlur = active ? 18 : 8;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(word, 0, 0);
      ctx.restore();
      x += ctx.measureText(word + ' ').width; wi++;
    });
  });
  ctx.restore();
}
function painMeter(t) {
  const w = sw('bol', t);
  if (w <= 0.01) return;
  const L = lt('bol', t), M = LY.meter;
  const v = lerp(0.92, 0.18, clamp((L - 1.4) / 5));
  ctx.save(); ctx.globalAlpha = w * clamp((L - 0.6) / 0.5);
  ctx.font = `600 ${VERT ? 32 : 28}px ${FONT}`; ctx.fillStyle = C.muted; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillText('jak bardzo przeszkadza', M.x, M.y);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; roundRect(M.x, M.y + 18, M.w, 26, 13); ctx.fill();
  const g = ctx.createLinearGradient(M.x, 0, M.x + M.w, 0); g.addColorStop(0, C.yellow); g.addColorStop(1, C.red);
  ctx.fillStyle = g; ctx.shadowColor = C.red; ctx.shadowBlur = 16; roundRect(M.x, M.y + 18, Math.max(26, M.w * v), 26, 13); ctx.fill();
  ctx.restore();
}
function checklist(t) {
  const w = sw('kontakt', t);
  if (w <= 0.01) return;
  const items = ['słyszysz głos terapeuty', 'wiesz, gdzie jesteś', 'możesz otworzyć oczy', 'nic wbrew sobie'];
  const M = LY.meter, y0 = VERT ? 450 : 490, lh = VERT ? 72 : 62, fs = VERT ? 44 : 34;
  ctx.save();
  items.forEach((it, i) => {
    const k = clamp((t - chunkStart('kontakt', i) - 0.2) / 0.45);
    if (k <= 0) return;
    const x = VERT ? 200 : M.x, y = y0 + i * lh + (1 - easeOut(k)) * 20;
    ctx.globalAlpha = w * easeOut(k);
    ctx.fillStyle = rgba(C.green, 0.2); ctx.strokeStyle = C.green; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + 20, y, 20 * easeBack(k), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.green; ctx.lineWidth = 5; ctx.lineCap = 'round';
    const ck = clamp((t - chunkStart('kontakt', i) - 0.4) / 0.3);
    ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10 + 7 * clamp(ck * 2), y + 7 * clamp(ck * 2));
    if (ck > 0.5) ctx.lineTo(x + 17 + 14 * clamp(ck * 2 - 1), y + 7 - 16 * clamp(ck * 2 - 1));
    ctx.stroke();
    ctx.font = `600 ${fs}px ${FONT}`; ctx.fillStyle = C.text; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
    ctx.fillText(it, x + 56, y + 2); ctx.shadowBlur = 0;
  });
  ctx.restore();
}
function eeg(t) {
  const w = sw('fale', t);
  if (w <= 0.01) return;
  const L = lt('fale', t), slow = ramp(L, 0.5, 4.5);
  const M = LY.meter, x0 = M.x, y0 = VERT ? 450 : 500, ww = M.w, hh = VERT ? 190 : 180;
  ctx.save(); ctx.globalAlpha = w * clamp((L - 0.3) / 0.5);
  ctx.fillStyle = 'rgba(5,8,22,0.55)'; roundRect(x0, y0, ww, hh, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  for (let gx = x0 + 40; gx < x0 + ww; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, y0); ctx.lineTo(gx, y0 + hh); ctx.stroke(); }
  ctx.save(); roundRect(x0, y0, ww, hh, 18); ctx.clip();
  ctx.beginPath();
  for (let x = 0; x <= ww; x += 2) {
    const tau = t - (ww - x) / 240;
    const fast = 0.45 * Math.sin(2 * Math.PI * 17 * tau) + 0.3 * Math.sin(2 * Math.PI * 11 * tau + 1) + 0.15 * Math.sin(2 * Math.PI * 23 * tau);
    const th = Math.sin(2 * Math.PI * 5.5 * tau) + 0.2 * Math.sin(2 * Math.PI * 9 * tau);
    const v = lerp(fast, th, slow);
    const y = y0 + hh / 2 - v * hh * 0.36;
    x ? ctx.lineTo(x0 + x, y) : ctx.moveTo(x0 + x, y);
  }
  const col = mix(C.cyan, C.violet, slow);
  ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.stroke();
  ctx.restore();
  ctx.font = `600 ${VERT ? 28 : 24}px ${FONT}`; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = rgba(C.cyan, 1 - slow); ctx.fillText('szybkie fale: czuwanie, myślenie', x0 + 16, y0 + hh + 12);
  ctx.fillStyle = rgba(C.violet, slow); ctx.fillText('wolne fale theta: głęboki relaks', x0 + 16, y0 + hh + 12);
  ctx.restore();
}
function endCard(t) {
  const k = clamp((t - (SC.koniec.end - 3.0)) / 0.8);
  if (k <= 0) return;
  ctx.save();
  ctx.fillStyle = `rgba(3,5,16,${0.65 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = k * clamp((DURATION - t) / 0.6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const s = VERT ? 1 : 0.9;
  ctx.font = `900 ${Math.round(100 * s)}px ${FONT}`;
  const g = ctx.createLinearGradient(W / 2 - 400, 0, W / 2 + 400, 0); g.addColorStop(0, '#9fe8ff'); g.addColorStop(1, '#e2d4ff');
  ctx.fillStyle = g; ctx.shadowColor = rgba(C.cyan, 0.6); ctx.shadowBlur = 40;
  const ty = (1 - easeOut(k)) * 30;
  if (VERT) { ctx.fillText('Mózg', W / 2, H / 2 - 120 + ty); ctx.fillText('w hipnozie', W / 2, H / 2 - 10 + ty); }
  else ctx.fillText('Mózg w hipnozie', W / 2, H / 2 - 50 + ty);
  ctx.shadowBlur = 0;
  const y = VERT ? H / 2 + 110 : H / 2 + 50;
  ctx.font = `500 ${Math.round(30 * s)}px ${FONT}`; ctx.fillStyle = C.muted;
  if (VERT) { ctx.fillText('Na podstawie badań m.in.', W / 2, y); ctx.fillText('Uniwersytetu Stanforda (2016)', W / 2, y + 44); }
  else ctx.fillText('Na podstawie badań m.in. Uniwersytetu Stanforda (2016)', W / 2, y);
  ctx.font = `400 ${Math.round(24 * s)}px ${FONT}`; ctx.fillStyle = C.faint;
  ctx.fillText('Część treści przedstawia perspektywę hipnoterapii.', W / 2, y + (VERT ? 110 : 50));
  ctx.fillText('Schemat uproszczony. Film edukacyjny.', W / 2, y + (VERT ? 150 : 86));
  ctx.restore();
}

// ---------- render ----------
let lastT = -1;
function render(t) {
  if (t !== lastT) { integrate(t); lastT = t; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  drawBackground(t);
  const cam = camera(t);
  drawSpiral(t, LY.vp.cx, LY.vp.cy, Math.max(sw('intro', t) * 0.9, sw('koniec', t) * 0.45, sw('sen', t) * 0.25), VERT ? 1.3 : 1.5);
  distractions(t, cam);
  ctx.save();
  const s = BASE * cam.z;
  ctx.translate(LY.vp.cx - cam.x * s, LY.vp.cy - cam.y * s); ctx.scale(s, s);
  drawBody(t, ramp(t, 0.3, 3.5), Math.max(sw('cialo', t), sw('bol', t) * 0.6));
  const br = 1 + 0.01 * Math.sin(t * 0.9); ctx.scale(br, br);
  drawBrain(t, clamp((t - 0.2) / 2.6), ramp(t, 1.8, 3.2));
  worldEffects(t);
  ctx.restore();
  spotlight(t, cam);
  vignette();
  flash(t);
  headline(t);
  painMeter(t);
  checklist(t);
  eeg(t);
  subtitles(t);
  endCard(t);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = rgba(C.cyan, 0.8); ctx.fillRect(0, H - 6, W * t / DURATION, 6);
}
window.render = render; window.DURATION = DURATION;
if (!location.hash.includes('static')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
